schema = 1

[[groups]]
id = "core"
label = "Core observatory"
description = "The compositor, shell runtime, audio controls, and Tonantzintla service adapters."
profiles = ["core", "recommended", "full"]
required = true

[[groups.capabilities]]
id = "niri"
label = "Niri compositor"
command = "niri"
official_packages = ["niri"]

[[groups.capabilities]]
id = "quickshell"
label = "Quickshell runtime"
command = "qs"
official_packages = ["quickshell"]
aur_packages = ["quickshell-git"]

[[groups.capabilities]]
id = "idle-lock"
label = "Idle lock coordinator"
command = "swayidle"
official_packages = ["swayidle"]

[[groups.capabilities]]
id = "python"
label = "Tonantzintla service adapters"
command = "python3"
official_packages = ["python"]

[[groups.capabilities]]
id = "pipewire-control"
label = "PipeWire volume control"
