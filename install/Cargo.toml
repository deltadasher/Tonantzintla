[package]
name = "tonantzintla-installer"
version = "1.2.0"
edition = "2024"
description = "Transactional TUI installer for Tonantzintla"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
